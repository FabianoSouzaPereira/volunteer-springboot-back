server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /volunteer

spring:
  application:
    name: volunteer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/volunteer}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_ENABLED:true}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP:user-registration-events-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
  expiration-ms: 86400000

app:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials: ${FIREBASE_CREDENTIALS:classpath:firebase-adminsdk.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
